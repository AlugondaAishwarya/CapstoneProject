spring.application.name=API-GATEWAY

server.port=9090

# Eureka Discovery Zone
eureka.client.service-url.defaultZone=http://${EUREKA_SERVER_HOST:localhost}:8761/eureka

# USER SERVICE ROUTE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://${USER_SERVICE_HOST:localhost}:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

# AUTH ROUTE
spring.cloud.gateway.routes[1].id=auth-service
spring.cloud.gateway.routes[1].uri=http://${USER_SERVICE_HOST:localhost}:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/auth/**

# APP SERVICE ROUTE
spring.cloud.gateway.routes[2].id=app-service
spring.cloud.gateway.routes[2].uri=http://${APP_SERVICE_HOST:localhost}:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/apps/**

# REVIEW SERVICE ROUTE
spring.cloud.gateway.routes[3].id=review-service
spring.cloud.gateway.routes[3].uri=http://${REVIEW_SERVICE_HOST:localhost}:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/reviews/**

# NOTIFICATION SERVICE ROUTE
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://${NOTIFICATION_SERVICE_HOST:localhost}:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**

# Global CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
