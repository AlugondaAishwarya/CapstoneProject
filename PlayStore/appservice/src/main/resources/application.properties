spring.application.name=APP-SERVICE

server.port=8082

eureka.client.service-url.defaultZone=http://${EUREKA_SERVER_HOST:localhost}:8761/eureka

notification.service.url=http://${NOTIFICATION_SERVICE_HOST:localhost}:8084

spring.datasource.url=jdbc:h2:file:./data/appdb

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
